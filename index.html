<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>张创的摄影空间</title>
    <style>
        :root {
            --bg: #f8f8f8;
            --card-bg: #fff;
            --text: #222;
            --text-light: #999;
            --accent: #ff2d55;
            --radius: 12px;
            --shadow: 0 1px 3px rgba(0,0,0,.08);
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased}

        /* Top Bar */
        .topbar{position:sticky;top:0;z-index:100;background:rgba(248,248,248,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(0,0,0,.06)}
        .topbar-title{font-size:17px;font-weight:700;color:var(--text);letter-spacing:-.2px}
        .topbar-actions{display:flex;gap:12px;align-items:center}
        .topbar-btn{width:32px;height:32px;border-radius:8px;border:none;background:transparent;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s;color:#555}
        .topbar-btn:hover{background:rgba(0,0,0,.06)}
        .topbar-dot{display:inline-block;width:6px;height:6px;border-radius:3px;background:#34c759;margin-right:6px}

        /* Stats Bar */
        .stats-bar{padding:8px 16px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-light)}
        .stats-bar span{display:flex;align-items:center;gap:4px}
        .stats-bar .sep{color:#ddd}

        /* Waterfall */
        .waterfall{columns:2;column-gap:8px;padding:0 12px 80px}
        @media(min-width:640px){.waterfall{columns:3;column-gap:12px;padding:0 16px 80px}}
        @media(min-width:1024px){.waterfall{columns:4;column-gap:16px;padding:0 20px 80px}}

        /* Card */
        .card{break-inside:avoid;margin-bottom:8px;background:var(--card-bg);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:transform .25s cubic-bezier(.25,.8,.25,1.2),box-shadow .25s;cursor:pointer;position:relative}
        @media(min-width:640px){.card{margin-bottom:12px}}
        @media(min-width:1024px){.card{margin-bottom:16px}}
        .card:active{transform:scale(.97)}
        .card:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.1)}
        .card-img-wrap{position:relative;overflow:hidden;background:#f0f0f0}
        .card img{width:100%;display:block;object-fit:cover;transition:transform .4s}
        .card:hover img{transform:scale(1.04)}
        .card-overlay{position:absolute;bottom:0;left:0;right:0;padding:20px 10px 8px;background:linear-gradient(transparent,rgba(0,0,0,.45));display:flex;justify-content:flex-end;gap:6px;opacity:0;transition:opacity .25s}
        .card:hover .card-overlay{opacity:1}
        .card-overlay-btn{width:30px;height:30px;border-radius:50%;border:none;background:rgba(255,255,255,.9);color:#333;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;backdrop-filter:blur(8px)}
        .card-overlay-btn:hover{background:#fff;transform:scale(1.1)}
        .card-overlay-btn.delete:hover{background:#ff2d55;color:#fff}
        .card-info{padding:8px 10px}
        .card-title{font-size:13px;font-weight:600;color:var(--text);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .card-meta{font-size:11px;color:var(--text-light);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

        /* FAB */
        .fab{position:fixed;bottom:24px;right:20px;width:50px;height:50px;border-radius:25px;border:none;background:var(--accent);color:#fff;font-size:24px;cursor:pointer;box-shadow:0 4px 16px rgba(255,45,85,.4);transition:all .25s cubic-bezier(.25,.8,.25,1.2);z-index:200;display:flex;align-items:center;justify-content:center}
        .fab:hover{transform:scale(1.08);box-shadow:0 6px 24px rgba(255,45,85,.5)}
        .fab:active{transform:scale(.95)}
        .fab-secondary{position:fixed;bottom:84px;right:24px;width:40px;height:40px;border-radius:20px;border:none;background:#fff;color:#555;font-size:18px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.12);transition:all .25s cubic-bezier(.25,.8,.25,1.2);z-index:199;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(0);pointer-events:none}
        .fab-secondary.show{opacity:1;transform:scale(1);pointer-events:auto}
        .fab-secondary:hover{background:#f0f0f0;transform:scale(1.05)}
        .fab-menu-bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:198;display:none}
        .fab-menu-bg.show{display:block}

        /* Modals */
        .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);z-index:500;flex-direction:column;align-items:center;justify-content:center}
        .modal.active{display:flex}
        .modal img{max-width:92%;max-height:70%;object-fit:contain;border-radius:4px}
        .modal-close{position:absolute;top:16px;right:20px;width:36px;height:36px;border-radius:18px;background:rgba(255,255,255,.15);color:#fff;font-size:22px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
        .modal-close:hover{background:rgba(255,255,255,.25)}
        .modal-info{color:#fff;text-align:center;padding:20px;max-width:300px}
        .modal-info h3{font-size:18px;margin-bottom:6px;font-weight:600}
        .modal-info p{font-size:13px;color:rgba(255,255,255,.7)}

        .edit-sheet{position:fixed;bottom:0;left:0;width:100%;background:#fff;border-radius:20px 20px 0 0;z-index:600;padding:24px 20px 40px;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);box-shadow:0 -4px 20px rgba(0,0,0,.1)}
        .edit-sheet.active{transform:translateY(0)}
        .edit-sheet-bg{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:599;display:none}
        .edit-sheet-bg.active{display:block}
        .edit-sheet h3{font-size:17px;font-weight:700;margin-bottom:16px;color:var(--text)}
        .edit-sheet label{display:block;font-size:12px;color:var(--text-light);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
        .edit-sheet input,.edit-sheet textarea{width:100%;padding:12px;border:1.5px solid #e8e8e8;border-radius:10px;font-size:15px;font-family:inherit;margin-bottom:14px;transition:border .2s;outline:none;background:#f9f9f9}
        .edit-sheet input:focus,.edit-sheet textarea:focus{border-color:var(--accent);background:#fff}
        .edit-sheet textarea{resize:none;height:80px}
        .edit-sheet-btns{display:flex;gap:10px}
        .sheet-btn{flex:1;padding:13px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;border:none;transition:all .2s}
        .sheet-btn.cancel{background:#f0f0f0;color:#555}
        .sheet-btn.save{background:var(--accent);color:#fff}
        .sheet-btn:active{transform:scale(.97)}

        .toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.82);color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;font-weight:500;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;backdrop-filter:blur(10px)}
        .toast.show{opacity:1}

        .loading-spin{text-align:center;padding:40px;color:#ccc;font-size:13px}
        .empty-state{text-align:center;padding:80px 20px;color:#bbb}
        .empty-state-icon{font-size:48px;margin-bottom:12px;display:block}
        .empty-state-text{font-size:14px;color:#bbb}
        .skeleton{background:linear-gradient(90deg,#eee 25%,#f5f5f5 50%,#eee 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:var(--radius)}
        @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

        input[type=file]{display:none}
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="topbar">
        <div class="topbar-title">📷 张创的摄影空间</div>
        <div class="topbar-actions">
            <span class="topbar-dot" id="statusDot"></span>
            <button class="topbar-btn" onclick="loadImages()" title="刷新">🔄</button>
        </div>
    </div>

    <!-- Stats -->
    <div class="stats-bar" id="statsBar" style="display:none">
        <span>共 <strong id="countNum">0</strong> 张</span>
        <span class="sep">·</span>
        <span id="lastUpdate"></span>
    </div>

    <!-- Waterfall -->
    <div class="waterfall" id="waterfall"></div>
    <div class="empty-state" id="emptyState">
        <span class="empty-state-icon">📸</span>
        <span class="empty-state-text">还没有照片，点右下角上传</span>
    </div>
    <div class="loading-spin" id="loading" style="display:none">加载中...</div>

    <!-- FAB Menu -->
    <div class="fab-menu-bg" id="fabBg" onclick="toggleFab()"></div>
    <button class="fab-secondary" id="fabGallery" onclick="document.getElementById('fileInput').click()">🖼️</button>
    <button class="fab" id="fabMain" onclick="toggleFab()">+</button>

    <input type="file" id="fileInput" accept="image/*" multiple>

    <!-- Image Modal -->
    <div class="modal" id="modal" onclick="closeModal()">
        <button class="modal-close" onclick="event.stopPropagation();closeModal()">✕</button>
        <img id="modalImg" src="">
        <div class="modal-info">
            <h3 id="modalTitle"></h3>
            <p id="modalMeta"></p>
        </div>
    </div>

    <!-- Edit Sheet -->
    <div class="edit-sheet-bg" id="editBg" onclick="closeEditSheet()"></div>
    <div class="edit-sheet" id="editSheet">
        <h3>编辑图片信息</h3>
        <label>标题</label>
        <input type="text" id="editTitle" maxlength="50" placeholder="输入标题...">
        <label>描述</label>
        <textarea id="editDesc" maxlength="150" placeholder="添加描述..."></textarea>
        <div class="edit-sheet-btns">
            <button class="sheet-btn cancel" onclick="closeEditSheet()">取消</button>
            <button class="sheet-btn save" onclick="saveEdit()">保存</button>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        var API_BASE = 'https://produces-describe-drawn-usual.trycloudflare.com';
        var images = [];
        var editingId = null;
        var fabOpen = false;

        // API
        async function api(method, path, body) {
            var opts = { method: method, headers: {} };
            if (body && !(body instanceof FormData)) {
                opts.headers['Content-Type'] = 'application/json';
                opts.body = JSON.stringify(body);
            } else if (body instanceof FormData) {
                opts.body = body;
            }
            var res = await fetch(API_BASE + path, opts);
            var data = await res.json();
            if (!res.ok) throw new Error(data.error || '请求失败');
            return data;
        }

        // Load images
        async function loadImages() {
            var w = document.getElementById('waterfall');
            var l = document.getElementById('loading');
            var e = document.getElementById('emptyState');
            l.style.display = 'block'; w.innerHTML = ''; e.style.display = 'none';
            try {
                var d = await api('GET', '/api/images');
                images = d.images;
                updateStatus(true, d.total);
                if (d.images.length === 0) { e.style.display = 'block'; }
                else { d.images.forEach(function(img) { w.appendChild(createCard(img)); }); }
            } catch(err) {
                updateStatus(false, 0);
                e.style.display = 'block';
                e.querySelector('.empty-state-text').textContent = '连接失败，请检查网络';
            }
            l.style.display = 'none';
        }

        // Create card (Xiaohongshu style)
        function createCard(img) {
            var c = document.createElement('div');
            c.className = 'card';
            var imgUrl = API_BASE + '/uploads/' + img.filename;
            c.innerHTML =
                '<div class="card-img-wrap" onclick="openModal(\'' + escJs(imgUrl) + '\',\'' + escJs(img.title) + '\',\'' + escJs(img.desc||'') + '\',\'' + fmtDate(img.createdAt) + '\',\'' + fmtSize(img.size) + '\')">' +
                '<img src="' + imgUrl + '" alt="' + esc(img.title) + '" loading="lazy">' +
                '<div class="card-overlay">' +
                '<button class="card-overlay-btn" onclick="event.stopPropagation();openEdit(\'' + img.id + '\',\'' + escJs(img.title) + '\',\'' + escJs(img.desc||'') + '\')" title="编辑">✎</button>' +
                '<button class="card-overlay-btn delete" onclick="event.stopPropagation();deleteImg(\'' + img.id + '\')" title="删除">✕</button>' +
                '</div></div>' +
                '<div class="card-info">' +
                '<div class="card-title">' + esc(img.title) + '</div>' +
                '<div class="card-meta">' + (img.desc || fmtDate(img.createdAt)) + '</div></div>';
            return c;
        }

        // Upload
        document.getElementById('fileInput').addEventListener('change', function(ev) {
            if (ev.target.files.length) { uploadFiles(ev.target.files); ev.target.value = ''; }
        });
        document.addEventListener('paste', function(e) {
            var items = e.clipboardData && e.clipboardData.items;
            if (items) {
                var files = [];
                for (var i = 0; i < items.length; i++) {
                    if (items[i].type.indexOf('image') !== -1) files.push(items[i].getAsFile());
                }
                if (files.length) uploadFiles(files);
            }
        });

        async function uploadFiles(files) {
            var fd = new FormData();
            var arr = Array.from(files).filter(function(f) { return f.type.startsWith('image/'); });
            if (!arr.length) { toast('请选择图片文件', true); return; }
            arr.forEach(function(f, i) { fd.append('images', f); fd.append('title_' + i, f.name.replace(/\.[^.]+$/, '')); fd.append('desc_' + i, ''); });
            toast('上传中 ' + arr.length + ' 张...');
            try {
                await api('POST', '/api/images', fd);
                toast('上传成功 ' + arr.length + ' 张！');
                await loadImages();
            } catch(err) {
                toast('上传失败: ' + err.message, true);
            }
        }

        // Delete
        async function deleteImg(id) {
            if (!confirm('确定删除这张照片？')) return;
            try { await api('DELETE', '/api/images/' + id); toast('已删除'); await loadImages(); }
            catch(e) { toast('删除失败: ' + e.message, true); }
        }

        // Edit
        function openEdit(id, title, desc) {
            editingId = id;
            document.getElementById('editTitle').value = title;
            document.getElementById('editDesc').value = desc || '';
            document.getElementById('editSheet').classList.add('active');
            document.getElementById('editBg').classList.add('active');
            setTimeout(function() { document.getElementById('editTitle').focus(); }, 350);
        }
        function closeEditSheet() {
            document.getElementById('editSheet').classList.remove('active');
            document.getElementById('editBg').classList.remove('active');
            editingId = null;
        }
        async function saveEdit() {
            var t = document.getElementById('editTitle').value.trim();
            if (!t) { toast('标题不能为空', true); return; }
            try {
                await api('PUT', '/api/images/' + editingId, { title: t, desc: document.getElementById('editDesc').value.trim() });
                closeEditSheet(); toast('已保存'); await loadImages();
            } catch(e) { toast('保存失败: ' + e.message, true); }
        }
        document.getElementById('editSheet').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveEdit(); }
        });

        // Modal
        function openModal(url, title, desc, date, size) {
            document.getElementById('modalImg').src = url;
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMeta').textContent = (desc ? desc + ' · ' : '') + date + ' · ' + size;
            document.getElementById('modal').classList.add('active');
        }
        function closeModal() { document.getElementById('modal').classList.remove('active'); }
        document.addEventListener('keydown', function(e) { if(e.key==='Escape') { closeModal(); closeEditSheet(); } });

        // FAB
        function toggleFab() {
            fabOpen = !fabOpen;
            var fb = document.getElementById('fabGallery');
            var bg = document.getElementById('fabBg');
            var fm = document.getElementById('fabMain');
            if (fabOpen) { fb.classList.add('show'); bg.classList.add('show'); fm.textContent = '✕'; fm.style.transform = 'rotate(45deg)'; }
            else { fb.classList.remove('show'); bg.classList.remove('show'); fm.textContent = '+'; fm.style.transform = 'rotate(0deg)'; }
        }

        // Status
        function updateStatus(online, total) {
            document.getElementById('statusDot').style.background = online ? '#34c759' : '#ff3b30';
            var s = document.getElementById('statsBar');
            if (online) { s.style.display = 'flex'; document.getElementById('countNum').textContent = total; document.getElementById('lastUpdate').textContent = justNow(); }
            else s.style.display = 'none';
        }

        // Toast
        function toast(msg, err) {
            var t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast' + (err ? ' error' : '') + ' show';
            clearTimeout(t._t);
            t._t = setTimeout(function() { t.classList.remove('show'); }, 2000);
        }

        // Utils
        function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
        function escJs(s) { return (s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n'); }
        function fmtDate(d) { if(!d) return ''; var t = new Date(d); return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate()); }
        function pad(n) { return n<10?'0'+n:n; }
        function fmtSize(b) { if(!b) return ''; if(b<1024*1024) return (b/1024).toFixed(1)+' KB'; return (b/(1024*1024)).toFixed(1)+' MB'; }
        function justNow() { var n = new Date(); return pad(n.getHours()) + ':' + pad(n.getMinutes()); }

        // Init
        loadImages();
    </script>
</body>
</html>
