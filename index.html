<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>张创的摄影空间</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px}
        .header{text-align:center;color:#fff;margin-bottom:30px}
        .header h1{font-size:2.5rem;margin-bottom:10px;text-shadow:2px 2px 4px rgba(0,0,0,.3)}
        .header p{font-size:1.1rem;opacity:.9}
        .controls{display:flex;justify-content:center;gap:15px;margin-bottom:20px;flex-wrap:wrap}
        .btn{padding:12px 24px;border:none;border-radius:25px;font-size:1rem;font-weight:600;cursor:pointer;transition:all .3s;box-shadow:0 4px 15px rgba(0,0,0,.2)}
        .btn-default{background:#fff;color:#667eea}
        .btn-default:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.3)}
        .btn-primary{background:#ff6b6b;color:#fff}
        .btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(255,107,107,.4)}
        .btn:active{transform:translateY(0)}
        .upload-zone{max-width:600px;margin:0 auto 25px;padding:25px;border:3px dashed rgba(255,255,255,.5);border-radius:20px;text-align:center;cursor:pointer;transition:all .3s;background:rgba(255,255,255,.1);backdrop-filter:blur(10px)}
        .upload-zone:hover,.upload-zone.dragover{border-color:#fff;background:rgba(255,255,255,.2);transform:scale(1.02)}
        .upload-zone-icon{font-size:3rem;margin-bottom:10px}
        .upload-zone-text{color:#fff;font-size:1.1rem;font-weight:500}
        .upload-zone-hint{color:rgba(255,255,255,.7);font-size:.85rem;margin-top:5px}
        .upload-status{max-width:600px;margin:0 auto 10px;text-align:center}
        .progress-bar{width:100%;height:8px;background:rgba(255,255,255,.3);border-radius:4px;overflow:hidden;display:none}
        .progress-fill{height:100%;background:#2ed573;border-radius:4px;transition:width .3s;width:0}
        .progress-text{color:#fff;font-size:.85rem;margin-top:5px;display:none}
        .status-bar{display:flex;justify-content:center;align-items:center;gap:20px;margin-bottom:20px;flex-wrap:wrap}
        .status-item{color:rgba(255,255,255,.9);font-size:.9rem;background:rgba(255,255,255,.15);padding:8px 16px;border-radius:20px}
        .status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
        .status-dot.online{background:#2ed573}.status-dot.offline{background:#ff4757}
        .masonry{columns:4;column-gap:15px;max-width:1400px;margin:0 auto}
        @media(max-width:1200px){.masonry{columns:3}}
        @media(max-width:768px){.masonry{columns:2}}
        @media(max-width:480px){.masonry{columns:1}}
        .card{break-inside:avoid;background:#fff;border-radius:15px;overflow:hidden;margin-bottom:15px;box-shadow:0 4px 15px rgba(0,0,0,.1);transition:all .3s;cursor:pointer;position:relative}
        .card:hover{transform:translateY(-5px);box-shadow:0 8px 25px rgba(0,0,0,.2)}
        .card img{width:100%;display:block;object-fit:cover}
        .card-content{padding:15px}
        .card-title{font-size:1rem;font-weight:600;color:#333;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
        .card-desc{font-size:.9rem;color:#666;line-height:1.4}
        .card-actions{display:flex;gap:8px;flex-shrink:0;margin-left:8px}
        .card-action{background:none;border:none;font-size:18px;cursor:pointer;transition:all .3s;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center}
        .card-action.edit:hover{background:#dfe6e9}
        .card-action.delete:hover{background:#ff4757;color:#fff}
        .loading{text-align:center;color:#fff;font-size:1.2rem;padding:30px}
        .empty-state{text-align:center;color:rgba(255,255,255,.7);padding:60px 20px;display:none}
        .empty-state-icon{font-size:4rem;margin-bottom:15px}
        .empty-state-text{font-size:1.2rem}
        .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);z-index:1000;justify-content:center;align-items:center}
        .modal.active{display:flex}
        .modal img{max-width:90%;max-height:90%;border-radius:10px}
        .modal-close{position:absolute;top:20px;right:30px;color:#fff;font-size:40px;cursor:pointer;transition:all .3s}
        .modal-close:hover{transform:scale(1.2)}
        .file-input-hidden{display:none}
        .edit-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:1001;justify-content:center;align-items:center}
        .edit-modal.active{display:flex}
        .edit-dialog{background:#fff;border-radius:15px;padding:25px;width:90%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
        .edit-dialog h3{margin-bottom:20px;color:#333}
        .edit-dialog label{display:block;font-size:.9rem;color:#666;margin-bottom:5px}
        .edit-dialog input,.edit-dialog textarea{width:100%;padding:10px 14px;border:2px solid #dfe6e9;border-radius:10px;font-size:1rem;margin-bottom:15px;font-family:inherit}
        .edit-dialog input:focus,.edit-dialog textarea:focus{outline:none;border-color:#667eea}
        .edit-dialog textarea{resize:vertical}
        .edit-dialog-buttons{display:flex;gap:10px;justify-content:flex-end}
        .btn-small{padding:8px 20px;font-size:.9rem}
        .btn-cancel{background:#dfe6e9;color:#636e72}
        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#2ed573;color:#fff;padding:12px 24px;border-radius:25px;font-weight:600;z-index:2000;box-shadow:0 4px 15px rgba(0,0,0,.2);opacity:0;transition:opacity .3s;pointer-events:none}
        .toast.show{opacity:1}
        .toast.error{background:#ff4757}
        /* API地址配置区 */
        .api-config{max-width:600px;margin:0 auto 20px;text-align:center}
        .api-config input{width:100%;padding:10px 14px;border:2px solid rgba(255,255,255,.3);border-radius:10px;font-size:.9rem;background:rgba(255,255,255,.15);color:#fff;text-align:center;backdrop-filter:blur(10px)}
        .api-config input::placeholder{color:rgba(255,255,255,.5)}
        .api-config input:focus{outline:none;border-color:#fff}
        .api-hint{color:rgba(255,255,255,.6);font-size:.8rem;margin-top:5px}
    </style>
</head>
<body>
    <div class="header">
        <h1>张创的摄影空间</h1>
        <p>发现美好，分享精彩瞬间</p>
    </div>

    <div class="controls">
        <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">上传图片</button>
        <button class="btn btn-default" onclick="loadFromServer()">刷新列表</button>
        <button class="btn btn-default" onclick="changeLayout()">切换布局</button>
    </div>

    <div class="upload-zone" id="uploadZone">
        <div class="upload-zone-icon">拖拽图片到此处上传</div>
        <div class="upload-zone-text">点击上传或拖拽图片</div>
        <div class="upload-zone-hint">支持 JPG/PNG/GIF/WebP，最多 20 张，单张 10MB</div>
    </div>

    <div class="upload-status">
        <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-text" id="progressText"></div>
    </div>

    <div class="api-config">
        <input type="text" id="apiUrl" placeholder="后端 API 地址，例如 https://xxx.trycloudflare.com" onchange="saveApiUrl()">
        <div class="api-hint">填入后端地址后自动保存，留空则尝试自动检测</div>
    </div>

    <input type="file" class="file-input-hidden" id="fileInput" accept="image/*" multiple>

    <div class="status-bar">
        <div class="status-item">
            <span class="status-dot online" id="statusDot"></span>
            <span id="statusText">连接中...</span>
        </div>
        <div class="status-item" id="totalCount" style="display:none">
            共 <strong id="countNum">0</strong> 张
        </div>
    </div>

    <div class="masonry" id="masonry"></div>
    <div class="empty-state" id="emptyState">
        <div class="empty-state-icon">no</div>
        <div class="empty-state-text">还没有图片，快来上传第一张吧！</div>
    </div>
    <div class="loading" id="loading" style="display:none">加载中...</div>

    <div class="modal" id="modal" onclick="closeModal()">
        <span class="modal-close">&times;</span>
        <img id="modal-img" src="" alt="">
    </div>

    <div class="edit-modal" id="editModal">
        <div class="edit-dialog">
            <h3>编辑图片信息</h3>
            <label>标题</label>
            <input type="text" id="editTitle" maxlength="50">
            <label>描述</label>
            <textarea id="editDesc" rows="3" maxlength="200"></textarea>
            <div class="edit-dialog-buttons">
                <button class="btn btn-small btn-cancel" onclick="closeEditModal()">取消</button>
                <button class="btn btn-small btn-primary" onclick="saveEdit()">保存</button>
            </div>
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <script>
        var API_BASE = 'https://produces-describe-drawn-usual.trycloudflare.com';
        var currentImages = [];
        var currentLayout = 4;
        var editingId = null;

        // 加载保存的 API 地址
        function loadApiUrl() {
            var saved = localStorage.getItem('api_base_url');
            if (saved) {
                API_BASE = saved;
                document.getElementById('apiUrl').value = saved;
            } else if (API_BASE) {
                document.getElementById('apiUrl').placeholder = '当前: ' + API_BASE;
            }
        }

        function saveApiUrl() {
            var val = document.getElementById('apiUrl').value.trim();
            API_BASE = val.replace(/\/+$/, '');
            if (API_BASE) {
                localStorage.setItem('api_base_url', API_BASE);
            }
            loadFromServer();
        }

        async function api(method, path, body) {
            if (!API_BASE) throw new Error('请先填入后端 API 地址');
            var opts = { method: method, headers: {} };
            if (body && !(body instanceof FormData)) {
                opts.headers['Content-Type'] = 'application/json';
                opts.body = JSON.stringify(body);
            } else if (body instanceof FormData) {
                opts.body = body;
            }
            var res = await fetch(API_BASE + path, opts);
            var data = await res.json();
            if (!res.ok) throw new Error(data.error || '请求失败');
            return data;
        }

        async function loadFromServer() {
            var m = document.getElementById('masonry');
            var l = document.getElementById('loading');
            var e = document.getElementById('emptyState');
            l.style.display = 'block'; m.innerHTML = '';
            try {
                var d = await api('GET', '/api/images');
                currentImages = d.images;
                updateStatus(true, d.total);
                if (d.images.length === 0) { e.style.display = 'block'; }
                else { e.style.display = 'none'; d.images.forEach(function(img) { m.appendChild(createCard(img)); }); }
            } catch(err) {
                updateStatus(false, 0);
                showToast('加载失败: ' + err.message, true);
            }
            l.style.display = 'none';
        }

        document.getElementById('fileInput').addEventListener('change', function(ev) {
            if (ev.target.files.length) { uploadFiles(ev.target.files); ev.target.value = ''; }
        });

        var uz = document.getElementById('uploadZone');
        uz.addEventListener('click', function() { document.getElementById('fileInput').click(); });
        uz.addEventListener('dragover', function(e) { e.preventDefault(); uz.classList.add('dragover'); });
        uz.addEventListener('dragleave', function(e) { e.preventDefault(); uz.classList.remove('dragover'); });
        uz.addEventListener('drop', function(e) { e.preventDefault(); uz.classList.remove('dragover'); if (e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files); });

        async function uploadFiles(files) {
            var pb = document.getElementById('progressBar');
            var pf = document.getElementById('progressFill');
            var pt = document.getElementById('progressText');
            var fd = new FormData();
            var arr = Array.from(files).filter(function(f) { return f.type.startsWith('image/'); });
            if (!arr.length) { showToast('请选择图片', true); return; }
            arr.forEach(function(f, i) { fd.append('images', f); fd.append('title_' + i, f.name.replace(/\.[^.]+$/, '')); fd.append('desc_' + i, ''); });
            pb.style.display = 'block'; pt.style.display = 'block';
            pf.style.width = '20%'; pt.textContent = '上传中 ' + arr.length + ' 张...';
            var sim = 20;
            var timer = setInterval(function() { sim += 8; if (sim <= 85) pf.style.width = sim + '%'; }, 200);
            try {
                var d = await api('POST', '/api/images', fd);
                clearInterval(timer); pf.style.width = '100%'; pt.textContent = '成功上传 ' + d.images.length + ' 张！';
                await loadFromServer();
            } catch(err) {
                clearInterval(timer); showToast('上传失败: ' + err.message, true);
            }
            setTimeout(function() { pb.style.display = 'none'; pt.style.display = 'none'; pf.style.width = '0'; }, 2000);
        }

        async function deleteImage(id, ev) {
            if (ev) ev.stopPropagation();
            if (!confirm('确定删除？')) return;
            try { await api('DELETE', '/api/images/' + id); showToast('已删除'); await loadFromServer(); }
            catch(e) { showToast('删除失败: ' + e.message, true); }
        }

        function openEditModal(id, title, desc, ev) {
            if (ev) ev.stopPropagation();
            editingId = id;
            document.getElementById('editTitle').value = title;
            document.getElementById('editDesc').value = desc || '';
            document.getElementById('editModal').classList.add('active');
        }
        function closeEditModal() { document.getElementById('editModal').classList.remove('active'); editingId = null; }

        async function saveEdit() {
            var t = document.getElementById('editTitle').value.trim();
            if (!t) { showToast('标题不能为空', true); return; }
            try {
                await api('PUT', '/api/images/' + editingId, { title: t, desc: document.getElementById('editDesc').value.trim() });
                closeEditModal(); showToast('保存成功'); await loadFromServer();
            } catch(e) { showToast('保存失败: ' + e.message, true); }
        }

        function createCard(img) {
            var c = document.createElement('div');
            c.className = 'card';
            var imgUrl = API_BASE + '/uploads/' + img.filename;
            c.innerHTML = '<img src="' + imgUrl + '" alt="' + esc(img.title) + '" loading="lazy" onclick="openModal(\'' + imgUrl + '\')">' +
                '<div class="card-content"><div class="card-title"><span>' + esc(img.title) + '</span>' +
                '<div class="card-actions">' +
                '<button class="card-action edit" onclick="openEditModal(\'' + img.id + '\',\'' + escJs(img.title) + '\',\'' + escJs(img.desc||'') + '\',event)" title="编辑">&#9998;</button>' +
                '<button class="card-action delete" onclick="deleteImage(\'' + img.id + '\',event)" title="删除">&#10005;</button>' +
                '</div></div><div class="card-desc">' + (img.desc || fmtDate(img.createdAt) + ' | ' + fmtSize(img.size)) + '</div></div>';
            return c;
        }

        function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
        function escJs(s) { return (s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n'); }
        function fmtDate(d) { if(!d) return ''; var t = new Date(d); return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate())+' '+pad(t.getHours())+':'+pad(t.getMinutes()); }
        function pad(n) { return n<10?'0'+n:n; }
        function fmtSize(b) { if(!b) return ''; if(b<1024) return b+' B'; if(b<1024*1024) return (b/1024).toFixed(1)+' KB'; return (b/(1024*1024)).toFixed(1)+' MB'; }

        function updateStatus(online, total) {
            document.getElementById('statusDot').className = 'status-dot ' + (online ? 'online' : 'offline');
            document.getElementById('statusText').textContent = online ? '已连接' : '未连接';
            var tc = document.getElementById('totalCount');
            if (online) { tc.style.display = 'inline'; document.getElementById('countNum').textContent = total; }
            else tc.style.display = 'none';
        }

        function showToast(msg, isErr) {
            var t = document.getElementById('toast'); t.textContent = msg;
            t.className = 'toast' + (isErr ? ' error' : '') + ' show';
            clearTimeout(t._t); t._t = setTimeout(function() { t.classList.remove('show'); }, 3000);
        }

        function changeLayout() {
            var m = document.getElementById('masonry');
            var lays = [1,2,3,4];
            currentLayout = lays[(lays.indexOf(currentLayout)+1)%lays.length];
            m.style.columns = currentLayout;
        }

        function openModal(url) { document.getElementById('modal').classList.add('active'); document.getElementById('modal-img').src = url; }
        function closeModal() { document.getElementById('modal').classList.remove('active'); }

        document.getElementById('editModal').addEventListener('click', function(e) { if(e.target===this) closeEditModal(); });
        document.getElementById('editModal').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveEdit(); }
            if (e.key === 'Escape') closeEditModal();
        });
        document.addEventListener('keydown', function(e) { if(e.key==='Escape') closeModal(); });

        (function init() {
            loadApiUrl();
            if (API_BASE) {
                loadFromServer();
            } else {
                updateStatus(false, 0);
                document.getElementById('apiUrl').placeholder = '请填入后端 API 地址';
            }
        })();
    </script>
</body>
</html>
