<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>张创的摄影空间</title>
    <style>
        :root {
            --bg: #f5f5f5;
            --card-bg: #fff;
            --text: #1a1a1a;
            --text-secondary: #8e8e93;
            --accent: #ff2d55;
            --accent-glow: rgba(255,45,85,.15);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: .3s cubic-bezier(.4,0,.2,1);
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}

        /* ── Top Bar ── */
        .topbar{position:sticky;top:0;z-index:100;background:rgba(245,245,245,.85);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);padding:12px 20px;display:flex;align-items:center;justify-content:space-between}
        .topbar-brand{display:flex;align-items:center;gap:10px}
        .topbar-avatar{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;box-shadow:0 2px 8px rgba(102,126,234,.3)}
        .topbar-title{font-size:18px;font-weight:700;color:var(--text);letter-spacing:-.3px}
        .topbar-right{display:flex;align-items:center;gap:8px}
        .topbar-badge{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;background:rgba(52,199,89,.12);font-size:12px;font-weight:600;color:#34c759;transition:all var(--transition)}
        .topbar-badge.offline{background:rgba(255,59,48,.1);color:#ff3b30}
        .pulse{width:7px;height:7px;border-radius:50%;background:currentColor;position:relative}
        .pulse::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:2px solid currentColor;opacity:.3;animation:pulse-ring 2s infinite}
        @keyframes pulse-ring{0%{transform:scale(1);opacity:.4}100%{transform:scale(2);opacity:0}}
        .topbar-btn{width:34px;height:34px;border-radius:10px;border:none;background:rgba(0,0,0,.04);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--transition);color:#555}
        .topbar-btn:hover{background:rgba(0,0,0,.08);transform:scale(1.05)}
        .topbar-btn:active{transform:scale(.95)}

        /* ── Stats ── */
        .stats-bar{padding:6px 20px 10px;display:flex;align-items:center;gap:12px;font-size:12px;font-weight:500;color:var(--text-secondary);opacity:0;transform:translateY(-8px);transition:all .4s cubic-bezier(.4,0,.2,1)}
        .stats-bar.visible{opacity:1;transform:translateY(0)}
        .stats-bar strong{color:var(--text);font-weight:700}

        /* ── Waterfall ── */
        .waterfall{columns:2;column-gap:10px;padding:0 14px 100px}
        @media(min-width:640px){.waterfall{columns:3;column-gap:14px;padding:0 20px 100px}}
        @media(min-width:1024px){.waterfall{columns:4;column-gap:18px;padding:0 24px 100px}}

        /* ── Card ── */
        .card{break-inside:avoid;margin-bottom:10px;background:var(--card-bg);border-radius:var(--radius);overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04);transition:transform .35s cubic-bezier(.25,.8,.25,1.2),box-shadow .35s;cursor:pointer;position:relative;animation:card-in .5s cubic-bezier(.4,0,.2,1) both}
        @media(min-width:640px){.card{margin-bottom:14px}}
        @media(min-width:1024px){.card{margin-bottom:18px}}
        @keyframes card-in{from{opacity:0;transform:translateY(20px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
        .card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.08)}
        .card:active{transform:scale(.975)}
        .card:nth-child(1){animation-delay:0s}
        .card:nth-child(2){animation-delay:.05s}
        .card:nth-child(3){animation-delay:.1s}
        .card:nth-child(4){animation-delay:.15s}
        .card:nth-child(5){animation-delay:.2s}
        .card:nth-child(6){animation-delay:.25s}
        .card:nth-child(7){animation-delay:.3s}
        .card:nth-child(8){animation-delay:.35s}

        /* Image */
        .card-img-wrap{position:relative;overflow:hidden;background:#e8e8ed;line-height:0}
        .card-img-wrap::before{content:'';display:block;padding-bottom:100%}
        .card-img-wrap img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.25,.8,.25,1.2),opacity .4s;opacity:0}
        .card-img-wrap img.loaded{opacity:1}
        .card:hover .card-img-wrap img{transform:scale(1.06)}
        .card-img-wrap .img-placeholder{position:absolute;inset:0;background:linear-gradient(135deg,#f0f0f5,#e5e5ea);display:flex;align-items:center;justify-content:center;font-size:32px;opacity:1;transition:opacity .3s}
        .card-img-wrap .img-placeholder.hidden{opacity:0}

        /* Gradient overlay */
        .card-gradient{position:absolute;bottom:0;left:0;right:0;height:50%;background:linear-gradient(to top,rgba(0,0,0,.35),transparent);pointer-events:none;opacity:0;transition:opacity var(--transition)}
        .card:hover .card-gradient{opacity:1}

        /* Hover actions */
        .card-actions{position:absolute;bottom:10px;right:8px;display:flex;gap:6px;z-index:2;opacity:0;transform:translateY(6px);transition:all var(--transition)}
        .card:hover .card-actions,.card-actions.mobile{opacity:1;transform:translateY(0)}
        .card-btn{width:32px;height:32px;border-radius:50%;border:none;background:rgba(255,255,255,.92);color:#333;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;backdrop-filter:blur(10px);box-shadow:0 2px 8px rgba(0,0,0,.1)}
        .card-btn:hover{background:#fff;transform:scale(1.12)}
        .card-btn.danger:hover{background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(255,45,85,.35)}

        /* Card info */
        .card-info{padding:10px 12px 12px}
        .card-title{font-size:13px;font-weight:600;color:var(--text);line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.1px}
        .card-meta{font-size:11px;color:var(--text-secondary);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}

        /* ── Skeleton ── */
        .skeleton-card{break-inside:avoid;margin-bottom:10px;background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
        @media(min-width:640px){.skeleton-card{margin-bottom:14px}}
        @media(min-width:1024px){.skeleton-card{margin-bottom:18px}}
        .skeleton-img{width:100%;padding-bottom:100%;background:linear-gradient(90deg,#eee 25%,#f5f5f5 50%,#eee 75%);background-size:200% 100%;animation:shimmer 1.8s infinite}
        .skeleton-line{height:12px;margin:10px 12px;border-radius:6px;background:linear-gradient(90deg,#eee 25%,#f5f5f5 50%,#eee 75%);background-size:200% 100%;animation:shimmer 1.8s infinite}
        .skeleton-line.short{width:55%;margin-bottom:14px}
        @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

        /* ── Empty State ── */
        .empty-state{display:none;text-align:center;padding:60px 30px}
        .empty-state.show{display:block;animation:fade-in .5s}
        .empty-icon{font-size:56px;margin-bottom:16px;display:block;animation:float 3s ease-in-out infinite}
        @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
        .empty-title{font-size:18px;font-weight:700;color:var(--text);margin-bottom:6px}
        .empty-desc{font-size:14px;color:var(--text-secondary);line-height:1.5}
        @keyframes fade-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

        /* ── FAB ── */
        .fab-wrap{position:fixed;bottom:28px;right:24px;z-index:200}
        .fab{width:52px;height:52px;border-radius:26px;border:none;background:linear-gradient(135deg,#ff2d55,#ff3b6e);color:#fff;font-size:26px;cursor:pointer;box-shadow:0 4px 20px rgba(255,45,85,.4);transition:all .3s cubic-bezier(.25,.8,.25,1.2);display:flex;align-items:center;justify-content:center;position:relative;z-index:2}
        .fab:hover{transform:scale(1.08);box-shadow:0 6px 28px rgba(255,45,85,.5)}
        .fab:active{transform:scale(.94)}
        .fab.open{transform:rotate(45deg);background:#555}
        .fab-menu{position:absolute;bottom:64px;right:2px;display:flex;flex-direction:column;gap:10px;align-items:center}
        .fab-item{width:44px;height:44px;border-radius:22px;border:none;background:#fff;color:#555;font-size:18px;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.1);transition:all .25s cubic-bezier(.25,.8,.25,1.2);opacity:0;transform:scale(0) translateY(10px);pointer-events:none;display:flex;align-items:center;justify-content:center}
        .fab-item.show{opacity:1;transform:scale(1) translateY(0);pointer-events:auto}
        .fab-item:nth-child(1){transition-delay:.03s}
        .fab-item:nth-child(2){transition-delay:.06s}
        .fab-item:hover{background:#f5f5f5;transform:scale(1.08)}
        .fab-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:199;opacity:0;pointer-events:none;transition:opacity .3s}
        .fab-backdrop.show{opacity:1;pointer-events:auto}

        /* ── Modal ── */
        .modal{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
        .modal.active{opacity:1;pointer-events:auto}
        .modal-header{position:absolute;top:0;left:0;right:0;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;z-index:2}
        .modal-close{width:36px;height:36px;border-radius:18px;background:rgba(255,255,255,.12);color:#fff;font-size:20px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;backdrop-filter:blur(10px)}
        .modal-close:hover{background:rgba(255,255,255,.2);transform:scale(1.08)}
        .modal-count{color:rgba(255,255,255,.6);font-size:13px;font-weight:600}
        .modal-image-wrap{flex:1;display:flex;align-items:center;justify-content:center;width:100%;padding:60px 0 20px}
        .modal-img{max-width:92vw;max-height:65vh;object-fit:contain;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
        .modal-info{color:#fff;text-align:center;padding:0 30px 30px;max-width:400px}
        .modal-info h3{font-size:20px;font-weight:700;margin-bottom:4px;letter-spacing:-.2px}
        .modal-info p{font-size:14px;color:rgba(255,255,255,.55);line-height:1.5}
        .modal-actions{display:flex;gap:10px;justify-content:center;padding-bottom:40px}
        .modal-action{display:flex;align-items:center;gap:6px;padding:8px 18px;border-radius:20px;border:1.5px solid rgba(255,255,255,.2);background:transparent;color:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
        .modal-action:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.4)}
        .modal-action.danger:hover{background:rgba(255,45,85,.2);border-color:var(--accent);color:var(--accent)}

        /* ── Bottom Sheet ── */
        .sheet{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:20px 20px 0 0;z-index:600;padding:8px 0 0;transform:translateY(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);box-shadow:0 -8px 40px rgba(0,0,0,.12)}
        .sheet.active{transform:translateY(0)}
        .sheet-handle{width:36px;height:4px;border-radius:2px;background:#ddd;margin:0 auto 16px}
        .sheet-body{padding:0 24px 30px}
        .sheet-body h3{font-size:18px;font-weight:700;margin-bottom:16px;color:var(--text);letter-spacing:-.2px}
        .sheet-field{margin-bottom:16px}
        .sheet-field label{display:block;font-size:11px;color:var(--text-secondary);margin-bottom:6px;text-transform:uppercase;letter-spacing:.8px;font-weight:600}
        .sheet-field input,.sheet-field textarea{width:100%;padding:12px 14px;border:1.5px solid #e8e8ed;border-radius:var(--radius-sm);font-size:15px;font-family:inherit;transition:all .2s;outline:none;background:#f9f9fb;color:var(--text)}
        .sheet-field input:focus,.sheet-field textarea:focus{border-color:#aaa;background:#fff}
        .sheet-field textarea{resize:none;height:80px;line-height:1.5}
        .sheet-actions{display:flex;gap:10px;margin-top:4px}
        .sheet-btn{flex:1;padding:14px;border-radius:var(--radius-sm);font-size:15px;font-weight:700;cursor:pointer;border:none;transition:all .2s;letter-spacing:-.1px}
        .sheet-btn:active{transform:scale(.97)}
        .sheet-btn.cancel{background:#f0f0f5;color:#555}
        .sheet-btn.cancel:hover{background:#e5e5ea}
        .sheet-btn.primary{background:var(--accent);color:#fff;box-shadow:0 4px 14px var(--accent-glow)}
        .sheet-btn.primary:hover{filter:brightness(1.08)}
        .sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:599;opacity:0;pointer-events:none;transition:opacity .35s}
        .sheet-backdrop.active{opacity:1;pointer-events:auto}

        /* ── Toast ── */
        .toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.85);background:rgba(0,0,0,.86);color:#fff;padding:10px 22px;border-radius:22px;font-size:14px;font-weight:600;z-index:999;opacity:0;pointer-events:none;transition:all .35s cubic-bezier(.4,0,.2,1);backdrop-filter:blur(14px);white-space:nowrap}
        .toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
        .toast.error{background:rgba(255,45,85,.9)}

        /* ── Upload progress ── */
        .upload-overlay{position:fixed;top:0;left:0;right:0;z-index:300;background:rgba(245,245,245,.9);backdrop-filter:blur(10px);padding:14px 20px;display:flex;align-items:center;gap:10px;transform:translateY(-100%);transition:transform .35s cubic-bezier(.4,0,.2,1)}
        .upload-overlay.active{transform:translateY(0)}
        .upload-spinner{width:20px;height:20px;border:2.5px solid #ddd;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        .upload-text{font-size:14px;font-weight:600;color:var(--text)}

        input[type=file]{display:none}

        /* ── Touch optimizations ── */
        @media(hover:none){
            .card-actions{opacity:1;transform:translateY(0)}
            .card-gradient{opacity:1}
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="topbar">
        <div class="topbar-brand">
            <div class="topbar-avatar">📷</div>
            <div class="topbar-title">张创的摄影空间</div>
        </div>
        <div class="topbar-right">
            <div class="topbar-badge online" id="statusBadge">
                <span class="pulse"></span> 在线
            </div>
            <button class="topbar-btn" onclick="loadImages()" title="刷新">↻</button>
        </div>
    </div>

    <!-- Stats -->
    <div class="stats-bar" id="statsBar">
        <span>共 <strong id="countNum">0</strong> 张</span>
    </div>

    <!-- Upload Progress -->
    <div class="upload-overlay" id="uploadBar">
        <div class="upload-spinner"></div>
        <div class="upload-text" id="uploadText">上传中...</div>
    </div>

    <!-- Waterfall -->
    <div class="waterfall" id="waterfall"></div>

    <!-- Empty -->
    <div class="empty-state show" id="emptyState">
        <span class="empty-icon">📸</span>
        <div class="empty-title">还没有照片</div>
        <div class="empty-desc">点击右下角 + 按钮<br>或直接 Ctrl+V 粘贴图片</div>
    </div>

    <!-- FAB -->
    <div class="fab-backdrop" id="fabBackdrop" onclick="toggleFab()"></div>
    <div class="fab-wrap">
        <div class="fab-menu" id="fabMenu">
            <button class="fab-item" onclick="document.getElementById('fileInput').click();toggleFab()" title="选择图片">🖼️</button>
        </div>
        <button class="fab" id="fabMain" onclick="toggleFab()">+</button>
    </div>

    <input type="file" id="fileInput" accept="image/*" multiple>

    <!-- Image Modal -->
    <div class="modal" id="modal">
        <div class="modal-header">
            <span class="modal-count" id="modalCount"></span>
            <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-image-wrap" id="modalImageWrap">
            <img class="modal-img" id="modalImg" src="">
        </div>
        <div class="modal-info">
            <h3 id="modalTitle"></h3>
            <p id="modalMeta"></p>
        </div>
        <div class="modal-actions">
            <button class="modal-action" id="modalEditBtn" onclick="editFromModal()">✎ 编辑</button>
            <button class="modal-action danger" id="modalDeleteBtn" onclick="deleteFromModal()">✕ 删除</button>
        </div>
    </div>

    <!-- Edit Sheet -->
    <div class="sheet-backdrop" id="sheetBackdrop" onclick="closeSheet()"></div>
    <div class="sheet" id="sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-body">
            <h3>编辑图片信息</h3>
            <div class="sheet-field">
                <label>标题</label>
                <input type="text" id="editTitle" maxlength="50" placeholder="为这张照片起个名字...">
            </div>
            <div class="sheet-field">
                <label>描述</label>
                <textarea id="editDesc" maxlength="150" placeholder="写点什么..."></textarea>
            </div>
            <div class="sheet-actions">
                <button class="sheet-btn cancel" onclick="closeSheet()">取消</button>
                <button class="sheet-btn primary" onclick="saveEdit()">保存</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        var API = 'https://produces-describe-drawn-usual.trycloudflare.com';
        var images = [];
        var editId = null;
        var modalImgId = null;
        var fabOpen = false;

        // ── API ──
        async function api(m, p, b) {
            var o = {method:m, headers:{}};
            if(b && !(b instanceof FormData)){o.headers['Content-Type']='application/json';o.body=JSON.stringify(b)}
            else if(b instanceof FormData) o.body = b;
            var r = await fetch(API+p, o), d = await r.json();
            if(!r.ok) throw new Error(d.error||'失败');
            return d;
        }

        // ── Load ──
        async function loadImages() {
            var w = document.getElementById('waterfall');
            var e = document.getElementById('emptyState');
            // Show skeletons
            w.innerHTML = '';
            for(var i=0;i<4;i++) w.innerHTML += '<div class="skeleton-card" style="animation-delay:'+(i*.1)+'s"><div class="skeleton-img"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>';
            e.classList.remove('show');
            try {
                var d = await api('GET','/api/images');
                images = d.images;
                updateStatus(true, d.total);
                w.innerHTML = '';
                if(d.images.length===0){e.classList.add('show')}
                else {d.images.forEach(function(img,i){w.appendChild(buildCard(img,i))})}
            } catch(err) {
                updateStatus(false,0);
                w.innerHTML = '';
                e.classList.add('show');
                document.querySelector('.empty-title').textContent = '连接失败';
                document.querySelector('.empty-desc').textContent = '请检查后端是否运行';
            }
        }

        // ── Build Card ──
        function buildCard(img, idx) {
            var c = document.createElement('div');
            c.className = 'card';
            c.style.animationDelay = (idx * .05) + 's';
            var url = API + '/uploads/' + img.filename;
            c.innerHTML =
                '<div class="card-img-wrap" onclick="openModal(\''+img.id+'\')">'+
                '<span class="img-placeholder">🖼</span>'+
                '<img src="'+url+'" alt="'+esc(img.title)+'" loading="lazy" onload="this.classList.add(\'loaded\');this.previousElementSibling.classList.add(\'hidden\')" onerror="this.previousElementSibling.textContent=\'⚠\'">'+
                '<div class="card-gradient"></div>'+
                '<div class="card-actions">'+
                '<button class="card-btn" onclick="event.stopPropagation();openSheet(\''+img.id+'\')" title="编辑">✎</button>'+
                '<button class="card-btn danger" onclick="event.stopPropagation();removeImg(\''+img.id+'\')" title="删除">✕</button>'+
                '</div></div>'+
                '<div class="card-info">'+
                '<div class="card-title">'+esc(img.title)+'</div>'+
                '<div class="card-meta">'+(img.desc||fmtDate(img.createdAt))+'</div></div>';
            return c;
        }

        // ── Upload ──
        var fileInput = document.getElementById('fileInput');
        fileInput.addEventListener('change', function(e){if(e.target.files.length){upload(e.target.files);e.target.value=''}});
        document.addEventListener('paste', function(e){
            var items = e.clipboardData&&e.clipboardData.items;
            if(items){var fs=[];for(var i=0;i<items.length;i++){if(items[i].type.indexOf('image')!==-1)fs.push(items[i].getAsFile())}if(fs.length)upload(fs)}
        });
        document.addEventListener('dragover', function(e){e.preventDefault()});
        document.addEventListener('drop', function(e){e.preventDefault();if(e.dataTransfer.files.length)upload(e.dataTransfer.files)});

        async function upload(files) {
            var fd = new FormData();
            var arr = [].filter.call(files, function(f){return f.type.startsWith('image/')});
            if(!arr.length){toast('请选择图片',1);return}
            arr.forEach(function(f,i){fd.append('images',f);fd.append('title_'+i,f.name.replace(/\.[^.]+$/,''));fd.append('desc_'+i,'')});
            showUpload(true, '上传中 '+arr.length+' 张...');
            try {await api('POST','/api/images',fd);toast('上传成功 '+arr.length+' 张！');await loadImages()}
            catch(e){toast('上传失败: '+e.message,1)}
            showUpload(false);
        }

        function showUpload(s,m){var b=document.getElementById('uploadBar'),t=document.getElementById('uploadText');if(s){b.classList.add('active');t.textContent=m}else b.classList.remove('active')}

        // ── Delete ──
        async function removeImg(id) {
            if(!confirm('确定删除这张照片？')) return;
            try {await api('DELETE','/api/images/'+id);toast('已删除');await loadImages()}
            catch(e){toast('删除失败: '+e.message,1)}
        }
        async function deleteFromModal() {
            if(!confirm('确定删除这张照片？')) return;
            try {await api('DELETE','/api/images/'+modalImgId);toast('已删除');closeModal();await loadImages()}
            catch(e){toast('删除失败: '+e.message,1)}
        }

        // ── Edit ──
        function openSheet(id) {
            var img = images.find(function(x){return x.id===id}); if(!img) return;
            editId = id;
            document.getElementById('editTitle').value = img.title;
            document.getElementById('editDesc').value = img.desc||'';
            document.getElementById('sheet').classList.add('active');
            document.getElementById('sheetBackdrop').classList.add('active');
            setTimeout(function(){document.getElementById('editTitle').focus()},400);
        }
        function editFromModal() {closeModal();setTimeout(function(){openSheet(modalImgId)},300)}
        function closeSheet() {document.getElementById('sheet').classList.remove('active');document.getElementById('sheetBackdrop').classList.remove('active');editId=null}
        async function saveEdit() {
            var t = document.getElementById('editTitle').value.trim();
            if(!t){toast('标题不能为空',1);return}
            try {await api('PUT','/api/images/'+editId,{title:t,desc:document.getElementById('editDesc').value.trim()});closeSheet();toast('已保存');await loadImages()}
            catch(e){toast('保存失败: '+e.message,1)}
        }
        document.getElementById('sheet').addEventListener('keydown', function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();saveEdit()}});

        // ── Modal ──
        function openModal(id) {
            var img = images.find(function(x){return x.id===id}); if(!img) return;
            modalImgId = id;
            document.getElementById('modalImg').src = API + '/uploads/' + img.filename;
            document.getElementById('modalTitle').textContent = img.title;
            document.getElementById('modalMeta').textContent = (img.desc?img.desc+' · ':'') + fmtDate(img.createdAt) + ' · ' + fmtSize(img.size);
            document.getElementById('modalCount').textContent = fmtSize(img.size);
            document.getElementById('modal').classList.add('active');
        }
        function closeModal() {document.getElementById('modal').classList.remove('active');modalImgId=null}
        document.addEventListener('keydown', function(e){if(e.key==='Escape'){closeModal();closeSheet()}});

        // ── FAB ──
        function toggleFab() {
            fabOpen=!fabOpen;
            var m=document.getElementById('fabMenu'), b=document.getElementById('fabBackdrop'), f=document.getElementById('fabMain');
            var items=m.querySelectorAll('.fab-item');
            if(fabOpen){f.classList.add('open');b.classList.add('show');items.forEach(function(x){x.classList.add('show')})}
            else {f.classList.remove('open');b.classList.remove('show');items.forEach(function(x){x.classList.remove('show')})}
        }

        // ── Status ──
        function updateStatus(ok, total) {
            var badge = document.getElementById('statusBadge');
            var stats = document.getElementById('statsBar');
            if(ok) {
                badge.className = 'topbar-badge online';
                badge.innerHTML = '<span class="pulse"></span> 在线';
                stats.classList.add('visible');
                document.getElementById('countNum').textContent = total;
            } else {
                badge.className = 'topbar-badge offline';
                badge.innerHTML = '<span class="pulse"></span> 离线';
                stats.classList.remove('visible');
            }
        }

        // ── Toast ──
        function toast(m,e){var t=document.getElementById('toast');t.textContent=m;t.className='toast'+(e?' error':'')+' show';clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show')},2000)}

        // ── Utils ──
        function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
        function fmtDate(d){if(!d)return'';var t=new Date(d);return t.getFullYear()+'-'+p(t.getMonth()+1)+'-'+p(t.getDate())}
        function p(n){return n<10?'0'+n:n}
        function fmtSize(b){if(!b)return'';if(b<1024*1024)return(b/1024).toFixed(1)+' KB';return(b/(1024*1024)).toFixed(1)+' MB'}

        // ── Init ──
        loadImages();
    </script>
</body>
</html>
